name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm ci --prefix infra/lambda --omit=dev --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run test:api
      - run: npm run test:content
      - name: Require a content release plan
        run: npm run check:content-release
        env:
          CONTENT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
      - run: npm test --prefix client -- --watchAll=false
      - run: npm run build
        env:
          REACT_APP_API_URL: /api
          REACT_APP_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: [infrastructure, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run build
        env:
          REACT_APP_API_URL: /api
          REACT_APP_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Verify required content migrations are published
        run: npm run check:content-release -- --published
        env:
          CONTENT_DIFF_BASE: ${{ github.event.before || 'HEAD^' }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Package Lambda API
        working-directory: infra/lambda
        run: |
          npm ci --omit=dev --ignore-scripts
          zip -qr ../portfolio-api.zip . -x '*.DS_Store'
      - name: Deploy Lambda API
        run: aws lambda update-function-code --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" --zip-file fileb://infra/portfolio-api.zip
      - name: Upload immutable assets
        run: aws s3 sync client/build/static "s3://${{ vars.AWS_SITE_BUCKET }}/static" --delete --cache-control "public,max-age=31536000,immutable"
      - name: Upload site shell and public files
        run: aws s3 sync client/build "s3://${{ vars.AWS_SITE_BUCKET }}" --delete --exclude "static/*" --cache-control "public,max-age=0,must-revalidate"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
      - name: Verify deployed content and assets
        timeout-minutes: 8
        run: |
          for attempt in {1..12}; do
            if npm run check:content-release -- --deployed; then
              exit 0
            fi
            echo "Public deployment verification attempt ${attempt}/12 failed; allowing time for CloudFront propagation."
            sleep 15
          done
          echo "Deployed content/build/assets did not pass verification."
          exit 1
        env:
          CONTENT_DIFF_BASE: ${{ github.event.before || 'HEAD^' }}
